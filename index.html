<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7ff" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#07101f" media="(prefers-color-scheme:dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marco Hub">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" sizes="180x180" href="./apple-touch-icon-v7.png" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-v7.png">
<title>Marco Hub</title>
<style>
:root{
  --bg:#f4f7ff;--bg2:#eef4ff;--ink:#0c1930;--muted:#71809b;
  --glass:rgba(255,255,255,.72);--stroke:rgba(255,255,255,.82);
  --shadow:0 18px 48px rgba(45,72,118,.13);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#07101f;--bg2:#0d1728;--ink:#f8fbff;--muted:#9aa9c1;
    --glass:rgba(20,31,49,.72);--stroke:rgba(255,255,255,.10);
    --shadow:0 22px 58px rgba(0,0,0,.34);
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{
  min-height:100dvh;color:var(--ink);
  background:
    radial-gradient(circle at 8% -3%,rgba(39,135,255,.18),transparent 28%),
    radial-gradient(circle at 100% 8%,rgba(123,92,255,.14),transparent 25%),
    radial-gradient(circle at 35% 105%,rgba(30,185,200,.10),transparent 26%),
    linear-gradient(180deg,var(--bg),var(--bg2));
}
.shell{width:min(100%,760px);margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(38px + env(safe-area-inset-bottom,0px))}
.header{display:flex;align-items:center;gap:13px;padding:2px 2px 24px}
.avatar{
  width:56px;height:56px;border-radius:18px;display:block;overflow:hidden;flex:0 0 auto;
  border:1px solid var(--stroke);box-shadow:0 12px 34px rgba(47,104,233,.20);
}
.avatar img{display:block;width:100%;height:100%;object-fit:cover}
.title{font-size:28px;font-weight:950;letter-spacing:-.05em;line-height:1}
.subtitle{font-size:13px;color:var(--muted);font-weight:650;margin-top:6px}
.panel{
  border:1px solid var(--stroke);background:var(--glass);border-radius:30px;padding:18px;
  box-shadow:var(--shadow);backdrop-filter:blur(28px) saturate(155%);-webkit-backdrop-filter:blur(28px) saturate(155%);
}
.panelHead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:2px 2px 18px}
.panelHead h1{font-size:22px;line-height:1;margin:0;font-weight:950;letter-spacing:-.04em}
.panelHead span{font-size:11px;color:var(--muted);font-weight:750}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 12px}
.app{
  min-width:0;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;
  align-items:center;text-align:center;-webkit-tap-highlight-color:transparent;
  transition:transform .15s ease;
}
.app:active{transform:scale(.94)}
.icon{
  width:72px;height:72px;border-radius:22%;overflow:hidden;display:grid;place-items:center;
  margin-bottom:9px;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.70);
  box-shadow:0 11px 25px rgba(24,35,54,.16),inset 0 1px 0 rgba(255,255,255,.45);
}
.icon img{display:block;width:100%;height:100%;object-fit:cover}
.icon.contain img{width:78%;height:78%;object-fit:contain}
.name{width:100%;font-size:11.5px;font-weight:720;line-height:1.18;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{
  margin:20px 2px 0;padding-top:16px;border-top:1px solid rgba(127,127,127,.10);
  color:var(--muted);font-size:11px;line-height:1.45;text-align:center
}
@media(max-width:390px){
  .shell{padding-left:12px;padding-right:12px}
  .panel{padding:16px 12px;border-radius:27px}
  .grid{gap:17px 7px}
  .icon{width:64px;height:64px}
  .name{font-size:10.5px}
  .title{font-size:25px}
}
@media(min-width:640px){
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 20px}
  .icon{width:82px;height:82px}
  .name{font-size:12px}
}
</style>
</head>
<body>
<main class="shell">
  <header class="header">
    <div class="avatar"><img src="./apple-touch-icon-v7.png" alt=""></div>
    <div>
      <div class="title">Marco Hub</div>
      <div class="subtitle">Le tue PWA originali, tutte in un posto</div>
    </div>
  </header>

  <section class="panel" aria-label="Applicazioni">
    <div class="panelHead">
      <h1>Le tue app</h1>
      <span>Apri l’originale</span>
    </div>

    <div class="grid">
      <a class="app" href="/Dashboard/" aria-label="Apri Traffico">
        <div class="icon"><img src="/Dashboard/icon-192.png" alt=""></div>
        <div class="name">Traffico</div>
      </a>

      <a class="app" href="/Alice-Job-Radar/" aria-label="Apri Lavoro Alice">
        <div class="icon contain"><img src="/Alice-Job-Radar/icon.svg" alt=""></div>
        <div class="name">Lavoro Alice</div>
      </a>

      <a class="app" href="/English-Meeting/" aria-label="Apri English Drive">
        <div class="icon"><img src="/English-Meeting/apple-touch-icon.png" alt=""></div>
        <div class="name">Inglese</div>
      </a>

      <a class="app" href="/spesa/" aria-label="Apri Lista Spesa">
        <div class="icon contain"><img src="/spesa/icon.svg" alt=""></div>
        <div class="name">Spesa</div>
      </a>

      <a class="app" href="/spesa/buoni/" aria-label="Apri Buoni Spesa">
        <div class="icon"><img src="/spesa/buoni/icon-v12.png" alt=""></div>
        <div class="name">Buoni Spesa</div>
      </a>

      <a class="app" href="/AirFry-Ricette/" aria-label="Apri Ricette">
        <div class="icon"><img src="/AirFry-Ricette/icon-192.png" alt=""></div>
        <div class="name">Ricette</div>
      </a>

      <a class="app" href="/Train/" aria-label="Apri Treni">
        <div class="icon contain"><img src="/Train/icon.svg" alt=""></div>
        <div class="name">Treni</div>
      </a>

      <a class="app" href="/figli/" aria-label="Apri Calendario figli">
        <div class="icon"><img src="/figli/apple-touch-icon.png" alt=""></div>
        <div class="name">Calendario figli</div>
      </a>
    </div>

    <div class="note">Marco Hub non contiene copie delle app: ogni icona apre direttamente la PWA originale.</div>
  </section>
</main>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
